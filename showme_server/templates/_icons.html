{#- Inline 16px stroke icons. currentColor, 1.5px stroke, no fills. -#}
{% macro icon(name, extra="") -%}
<svg class="icon i-{{ name }} {{ extra }}" width="16" height="16" viewBox="0 0 16 16" fill="none"
     stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
     aria-hidden="true" focusable="false">
{%- if name == 'external' -%}
  <path d="M7 3H3.6A1.6 1.6 0 0 0 2 4.6v7.8A1.6 1.6 0 0 0 3.6 14h7.8a1.6 1.6 0 0 0 1.6-1.6V9"/><path d="M9.8 2.2H13.8V6.2"/><path d="M7.4 8.6 13.6 2.4"/>
{%- elif name == 'lock' -%}
  <rect x="2.8" y="7" width="10.4" height="7.2" rx="1.6"/><path d="M5.4 7V4.9a2.6 2.6 0 0 1 5.2 0V7"/>
{%- elif name == 'globe' -%}
  <circle cx="8" cy="8" r="6.2"/><path d="M1.8 8h12.4"/><path d="M8 1.8c1.7 1.7 2.6 3.8 2.6 6.2S9.7 12.5 8 14.2C6.3 12.5 5.4 10.4 5.4 8S6.3 3.5 8 1.8Z"/>
{%- elif name == 'copy' -%}
  <rect x="5.9" y="5.9" width="8.3" height="8.3" rx="1.7"/><path d="M10.4 5.9V3.5A1.7 1.7 0 0 0 8.7 1.8H3.5A1.7 1.7 0 0 0 1.8 3.5v5.2a1.7 1.7 0 0 0 1.7 1.7h2.4"/>
{%- elif name == 'check' -%}
  <path d="M3 8.4 6.4 11.8 13 4.6"/>
{%- elif name == 'more' -%}
  <circle cx="3.4" cy="8" r="1.15" fill="currentColor" stroke="none"/><circle cx="8" cy="8" r="1.15" fill="currentColor" stroke="none"/><circle cx="12.6" cy="8" r="1.15" fill="currentColor" stroke="none"/>
{%- elif name == 'alert' -%}
  <path d="M8 1.9 14.7 13.6a.6.6 0 0 1-.5.9H1.8a.6.6 0 0 1-.5-.9Z"/><path d="M8 6.3v3.2"/><path d="M8 12h.01"/>
{%- elif name == 'trash' -%}
  <path d="M2.4 4.1h11.2"/><path d="M6.2 4.1V2.8a1 1 0 0 1 1-1h1.6a1 1 0 0 1 1 1v1.3"/><path d="M3.8 4.1l.6 9.2a1.3 1.3 0 0 0 1.3 1.2h4.6a1.3 1.3 0 0 0 1.3-1.2l.6-9.2"/>
{%- elif name == 'archive' -%}
  <rect x="1.8" y="2.3" width="12.4" height="3.4" rx="1.1"/><path d="M3.1 5.7v6.6a1.6 1.6 0 0 0 1.6 1.6h6.6a1.6 1.6 0 0 0 1.6-1.6V5.7"/><path d="M6.4 8.7h3.2"/>
{%- elif name == 'restore' -%}
  <path d="M2.2 8a5.8 5.8 0 1 0 1.9-4.3"/><path d="M1.5 2.6v3.4h3.4"/>
{%- elif name == 'key' -%}
  <circle cx="5.4" cy="10.6" r="3.1"/><path d="M7.6 8.4 13.9 2.1"/><path d="M11.4 4.6 13 6.2"/><path d="M9.9 6.1 11.5 7.7"/>
{%- elif name == 'logout' -%}
  <path d="M6.2 14.2H3.6A1.6 1.6 0 0 1 2 12.6V3.4a1.6 1.6 0 0 1 1.6-1.6h2.6"/><path d="M10.6 11.2 13.8 8l-3.2-3.2"/><path d="M13.8 8H6"/>
{%- elif name == 'file' -%}
  <path d="M9.2 1.8H4.4a1.6 1.6 0 0 0-1.6 1.6v9.2a1.6 1.6 0 0 0 1.6 1.6h7.2a1.6 1.6 0 0 0 1.6-1.6V5.8Z"/><path d="M9.2 1.8v4h4"/>
{%- elif name == 'machine' -%}
  <rect x="1.8" y="2.6" width="12.4" height="8.4" rx="1.5"/><path d="M5.6 14.2h4.8"/><path d="M8 11v3.2"/>
{%- elif name == 'search' -%}
  <circle cx="7" cy="7" r="4.8"/><path d="m10.5 10.5 3.3 3.3"/>
{%- elif name == 'shield' -%}
  <path d="M8 1.6 13.2 3.5v4.2c0 3.1-2.1 5.7-5.2 6.7-3.1-1-5.2-3.6-5.2-6.7V3.5Z"/>
{%- elif name == 'arrow-right' -%}
  <path d="M2.6 8h10.8"/><path d="M9.4 4 13.4 8l-4 4"/>
{%- elif name == 'plus' -%}
  <path d="M8 2.8v10.4"/><path d="M2.8 8h10.4"/>
{%- elif name == 'edit' -%}
  <path d="M9.8 2.4 13.6 6.2"/><path d="m3 13 2.8-.6 7.5-7.5a1.5 1.5 0 0 0-2.2-2.2l-7.5 7.5Z"/><path d="M8.8 4.9 11.1 7.2"/>
{%- elif name == 'download' -%}
  <path d="M8 1.8v8.4"/><path d="m4.8 7.3 3.2 3.2 3.2-3.2"/><path d="M2.2 12.2v1.5h11.6v-1.5"/>
{%- endif -%}
</svg>
{%- endmacro %}
