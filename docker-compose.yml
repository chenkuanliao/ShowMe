services:
  showme:
    build: .
    restart: unless-stopped
    environment:
      SHOWME_BASE_URL: ${SHOWME_SCHEME:-http}://${SHOWME_HOST:-127.0.0.1}
      SHOWME_SECURE_COOKIES: ${SHOWME_SECURE_COOKIES:-true}
      SHOWME_MAX_UPLOAD_MB: ${SHOWME_MAX_UPLOAD_MB:-50}
    volumes:
      - showme_data:/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      showme:
        condition: service_healthy
    environment:
      SHOWME_HOST: ${SHOWME_HOST:-127.0.0.1}
      SHOWME_SCHEME: ${SHOWME_SCHEME:-http}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  showme_data:
  caddy_data:
  caddy_config:
